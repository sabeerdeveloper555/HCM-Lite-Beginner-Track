<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings · HCM Lite</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <div id="nav-mount"></div>
    <main>
      <div class="page-head"><h1>Company settings</h1></div>
      <p class="muted card" id="settingSummary" style="margin-bottom: 1rem"></p>

      <div class="card" style="max-width: 620px">
        <h3>Business rules</h3>
        <form id="settingsForm" novalidate>
          <label
            >Company name *<input name="company" /><span
              class="field-error"
              data-for="name"
            ></span
          ></label>
          <div class="grid cols-2">
            <label
              >Office start time (HH:MM) *<input
                name="start"
                placeholder="09:00" /><span
                class="field-error"
                data-for="startTime"
              ></span
            ></label>
            <label
              >Grace minutes *<input name="grace" type="number" min="0" /><span
                class="field-error"
                data-for="graceMinutes"
              ></span
            ></label>
            <label
              >Yearly leave quota (days) *<input
                name="quota"
                type="number"
                min="0" /><span class="field-error" data-for="leaveQuota"></span
            ></label>
            <label
              >Half-day threshold (hours) *<input
                name="half"
                type="number"
                min="1"
                step="0.5" /><span
                class="field-error"
                data-for="halfDayHours"
              ></span
            ></label>
          </div>
          <label
            >Working days<span class="field-error" data-for="workingDays"></span
          ></label>
          <div id="workDays" class="chk-row"></div>
          <button class="btn" type="submit">Save settings</button>
        </form>
      </div>
    </main>

    <script src="../js/storage.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/settings.js"></script>
    <script>
      const user = requireRole('admin');
      if (user) {
        renderChrome(user, 'Settings');
        document.getElementById('settingSummary').textContent = summaryText();
        initSettingsForm();
      }
    </script>
  </body>
</html>
