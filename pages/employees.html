<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Employees · HCM Lite</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <div id="nav-mount"></div>
    <main>
      <div class="page-head">
        <div>
          <h1>Employees</h1>
          <p class="muted" id="empCount">—</p>
        </div>
        <button class="btn" id="addBtn">+ Add employee</button>
      </div>

      <div class="toolbar">
        <input id="empSearch" placeholder="Search name or email…" />
        <select id="deptFilter">
          <option value="">All departments</option>
        </select>
        <button
          class="btn btn-ghost"
          id="exportBtn"
          title="Export all attendance to CSV"
        >
          Export attendance CSV
        </button>
      </div>

      <div class="card table-wrap">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Department</th>
              <th>Salary</th>
              <th>Attendance</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="empRows"></tbody>
        </table>
      </div>
    </main>

    <script src="../js/storage.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/attendance.js"></script>
    <script src="../js/leave.js"></script>
    <script src="../js/employees.js"></script>
    <script>
      const user = requireRole('admin');
      if (user) {
        renderChrome(user, 'Employees');
        refreshEmployeeView();
        document.getElementById('addBtn').onclick = () => openEmployeeForm();
        document.getElementById('empSearch').oninput = refreshEmployeeView;
        document.getElementById('deptFilter').onchange = refreshEmployeeView;
        document.getElementById('exportBtn').onclick = () => {
          exportAttendanceCSV(getAttendance());
          toast('Attendance exported.');
        };
      }
    </script>
  </body>
</html>
